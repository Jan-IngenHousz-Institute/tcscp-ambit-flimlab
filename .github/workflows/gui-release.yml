# Build the standalone phi2 GUI for Windows, Linux and macOS, and release it.
#
#   * every pull request builds and checks all three and keeps the zips as workflow artifacts. The
#     three builds are required checks on main.
#   * every push to main asks semantic-release whether the merged PR titles call for a release
#     (.releaserc.json). If they do, it builds the three zips and publishes them under that version.
#
# Each zip carries everything the app needs except the operating system's own libraries, so the
# person who downloads it installs nothing. packaging/check_bundle.py enforces that on Linux and
# macOS; the smoke test starts every build on a fresh runner.
#
# One job picks the version and every build writes it in (packaging/stamp_version.py), so the three
# executables and the release say the same number. A pull request builds <last tag>+pr.<number>.
#
# Supply chain: uv installs every package from uv.lock, TEDIEL's pylibtdc included (wheels on this
# repo's deps-pylibtdc-* release, hashes in uv.lock). packaging/fetch_driver.py takes the Felix
# driver installer only at its pinned SHA-256. semantic-release comes from the lockfile in
# packaging/release-tools, and every action is pinned to a commit.
#
# Recovery: semantic-release pushes the tag before it publishes the release. If the run fails in
# between, re-run all jobs: the main version job finds the tag at HEAD with an unfinished release,
# rebuilds that version, and the release job finishes it.
name: Build and release phi2 GUI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases stay serial; a manual run builds the zips but never publishes.
concurrency:
  group: phi2gui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_TOOLS: packaging/release-tools

jobs:
  pr-version:
    name: Pick the version
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          if [[ -n "$PR" ]]; then VERSION="${LAST#v}+pr.${PR}"; else VERSION="${LAST#v}+dev.${GITHUB_RUN_NUMBER}"; fi
          echo "Version: ${VERSION}. Build only, never released." >> "$GITHUB_STEP_SUMMARY"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  main-version:
    name: Pick the release version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # semantic-release checks it could push the tag, even in a dry run.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
      mode: ${{ steps.pick.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packaging/release-tools/package-lock.json
      - run: npm ci --prefix "$RELEASE_TOOLS" --no-audit --no-fund
      - id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT=$("$RELEASE_TOOLS/node_modules/.bin/semantic-release" --dry-run 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT" | tail -20
          VERSION=$(sed -n 's/.*The next release version is \([0-9][^ ]*\).*/\1/p' <<<"$OUT" | head -1)
          MODE=new
          if [[ -z "$VERSION" ]]; then
            MODE=none
            TAG=$(git tag --points-at HEAD --list 'v[0-9]*' | sort -V | tail -1)
            if [[ -n "$TAG" ]]; then
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq \
                "[.[] | select(.tag_name == \"$TAG\")][0] | if . then \"\(.draft) \([.assets[].name] | sort | join(\",\"))\" else \"missing\" end")
              WANT="false SHA256SUMS,phi2gui-${TAG}-linux-x64.zip,phi2gui-${TAG}-macos-arm64.zip,phi2gui-${TAG}-win64.zip"
              if [[ "$STATE" != "$WANT" ]]; then
                VERSION="${TAG#v}"
                MODE=resume
                echo "::warning::${TAG} is tagged but its release is unfinished (${STATE}); rebuilding to finish it."
              fi
            fi
          fi
          echo "Version: ${VERSION:-none}. Mode: ${MODE}." >> "$GITHUB_STEP_SUMMARY"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: [pr-version, main-version]
    # One of the two version jobs is always skipped, hence !cancelled() instead of the implicit success().
    if: >-
      !cancelled() && (needs.pr-version.result == 'success'
      || (needs.main-version.result == 'success' && needs.main-version.outputs.mode != 'none'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
            bundle: dist/phi2gui
            executable: dist/phi2gui/phi2gui.exe
          # The oldest supported Ubuntu, so the bundle runs on any Linux with that glibc or newer.
          - os: ubuntu-22.04
            platform: linux-x64
            bundle: dist/phi2gui
            executable: dist/phi2gui/phi2gui
          - os: macos-15
            platform: macos-arm64
            bundle: dist/phi2gui.app
            executable: dist/phi2gui.app/Contents/MacOS/phi2gui
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.pr-version.outputs.version || needs.main-version.outputs.version }}
      # Info-ZIP's zip reads a variable named ZIP as extra arguments, hence ARCHIVE.
      ARCHIVE: phi2gui-v${{ needs.pr-version.outputs.version || needs.main-version.outputs.version }}-${{ matrix.platform }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The python.org interpreter; uv makes .venv from it and never downloads one of its own.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: python
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # PyInstaller bundles the libraries it finds on the build machine. Qt's X11 window plugin
      # needs these, and a stock Ubuntu desktop lacks some (libxcb-cursor0 above all), so they go
      # into the bundle from here.
      - name: Install the X11 libraries Qt needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libfreetype6 libdbus-1-3 libegl1 libgl1

      - name: Install dependencies
        shell: bash
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --group build

      - name: Fetch TEDIEL's Felix driver installer at its pinned SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: uv run --no-sync python packaging/fetch_driver.py

      - name: Run tests
        shell: bash
        run: uv run --no-sync pytest -q

      - name: Stamp the version
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python packaging/stamp_version.py "$VERSION"

      # PATH cut down to Windows, this Python and .venv, as build_phi2gui.bat does: PyInstaller
      # resolves DLLs through PATH, and a foreign ICU or OpenSSL on it broke v0.1.3 on every PC.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vpy = Resolve-Path .venv\Scripts\python.exe
          $base = & $vpy -c "import sys; print(sys.base_prefix)"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$base;$(Split-Path $vpy)"
          & $vpy -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/phi2gui.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Linux and macOS)
        if: runner.os != 'Windows'
        run: uv run --no-sync python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/phi2gui.spec

      - name: Check every library outside the OS is bundled (Linux and macOS)
        if: runner.os != 'Windows'
        run: uv run --no-sync python packaging/check_bundle.py "${{ matrix.bundle }}"

      # The frozen app loads Qt, pylibtdc's libraries (Windows and Linux) and the main window, then
      # exits. This is the check that would have stopped v0.1.3 ("DLL load failed").
      - name: Smoke-test the executable
        shell: bash
        env:
          EXE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess, sys
          exe = pathlib.Path(os.environ["EXE"]).resolve()
          out = pathlib.Path("smoke-ok.txt").resolve()
          code = subprocess.run([str(exe), "--smoke-test", str(out)], timeout=300).returncode
          log = (pathlib.Path.home() / "Library/Logs/phi2gui.log" if sys.platform == "darwin"
                 else exe.with_name("phi2gui.log"))
          said = out.read_text(encoding="utf-8").strip() if out.is_file() else ""
          if code != 0 or said != f"ok {os.environ['VERSION']}":
              print(log.read_text(encoding="utf-8", errors="replace") if log.is_file() else "(no phi2gui.log)")
              sys.exit(f"smoke test failed (exit {code}, said {said!r})")
          print(said)
          log.unlink(missing_ok=True)
          PY

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging/README-dist.txt dist/phi2gui/README.txt
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/phi2gui -DestinationPath "out/$env:ARCHIVE" -CompressionLevel Optimal

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cp packaging/README-dist.txt dist/phi2gui/README.txt
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd dist
          zip -q -r -y "$GITHUB_WORKSPACE/out/$ARCHIVE" phi2gui
          ls -la "$GITHUB_WORKSPACE/out"
          test -s "$GITHUB_WORKSPACE/out/$ARCHIVE"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p pkg/phi2gui "$GITHUB_WORKSPACE/out"
          cp -R dist/phi2gui.app pkg/phi2gui/
          cp packaging/README-dist.txt pkg/phi2gui/README.txt
          ditto -c -k --keepParent pkg/phi2gui "$GITHUB_WORKSPACE/out/$ARCHIVE"
          ls -la "$GITHUB_WORKSPACE/out"
          test -s "$GITHUB_WORKSPACE/out/$ARCHIVE"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: phi2gui-${{ matrix.platform }}-${{ github.sha }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [main-version, build]
    if: github.event_name == 'push' && needs.main-version.outputs.mode != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.main-version.outputs.version }}
      TAG: v${{ needs.main-version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: phi2gui-*-${{ github.sha }}
          merge-multiple: true
          path: out

      - name: Checksums
        run: |
          set -euo pipefail
          cd out
          for p in win64 linux-x64 macos-arm64; do test -s "phi2gui-v${VERSION}-${p}.zip"; done
          sha256sum phi2gui-*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: needs.main-version.outputs.mode == 'new'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packaging/release-tools/package-lock.json

      # Tags the commit and publishes the release with the zips, SHA256SUMS and notes written from
      # the PR titles since the last release (.releaserc.json). The next step finishes the job if
      # this one fails after tagging.
      - name: semantic-release
        if: needs.main-version.outputs.mode == 'new'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --prefix "$RELEASE_TOOLS" --no-audit --no-fund
          "$RELEASE_TOOLS/node_modules/.bin/semantic-release"

      # A release that semantic-release left unfinished, or that an earlier run left as a tag, a
      # draft, or short of assets, gets its assets uploaded and is published here.
      - name: Finish the release
        run: |
          set -euo pipefail
          git fetch --tags --force -q
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} was never tagged, so semantic-release stopped early. See its step, then re-run all jobs."
            exit 1
          fi
          test "$(git rev-list -n 1 "${TAG}")" = "${GITHUB_SHA}" || { echo "::error::${TAG} points at another commit"; exit 1; }
          state() {
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq \
              "[.[] | select(.tag_name == \"$TAG\")][0] | if . then \"\(.draft) \([.assets[].name] | sort | join(\",\"))\" else \"missing\" end"
          }
          WANT="false SHA256SUMS,phi2gui-${TAG}-linux-x64.zip,phi2gui-${TAG}-macos-arm64.zip,phi2gui-${TAG}-win64.zip"
          STATE=$(state)
          if [[ "$STATE" == "$WANT" ]]; then
            echo "${TAG} is published with all its assets."
            exit 0
          fi
          echo "::warning::finishing ${TAG}, found: ${STATE}"
          if [[ "$STATE" == missing ]]; then
            gh release create "$TAG" --verify-tag --draft --title "phi2 GUI ${VERSION}" --generate-notes \
              --notes "Download the zip for your computer, extract all of it and read README.txt inside."
          fi
          gh release upload "$TAG" out/phi2gui-*.zip out/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest

      - name: Check the release
        run: |
          set -euo pipefail
          WANT="false SHA256SUMS,phi2gui-${TAG}-linux-x64.zip,phi2gui-${TAG}-macos-arm64.zip,phi2gui-${TAG}-win64.zip"
          GOT=$(gh release view "$TAG" --json isDraft,assets --jq '"\(.isDraft) \([.assets[].name] | sort | join(","))"')
          echo "$GOT"
          test "$GOT" = "$WANT"
          echo "Released ${TAG}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
