# Build the standalone phi2 GUI for Windows, Linux and macOS, and release it.
#
#   * pull requests build and check all three and keep the zips as workflow artifacts;
#   * every push to main that touches the GUI publishes them as a GitHub release, tagged v<next>.
#
# Each zip carries everything the app needs except the operating system's own libraries, so the
# person who downloads it installs nothing. packaging/check_bundle.py enforces that on Linux and
# macOS; the smoke test starts every build on a fresh runner.
#
# The version is the latest v* tag's patch + 1, or __version__ in phi2gui/__init__.py when a person
# raised it above that (packaging/stamp_version.py). One job picks it and every build writes it in,
# so the three executables and the release always say the same number.
#
# uv installs every package from uv.lock, TEDIEL's pylibtdc included (wheels on this repo's
# deps-pylibtdc-* release), and `uv sync --locked` fails the build when uv.lock is out of date.
name: Build and release phi2 GUI

on:
  pull_request:
    paths:
      - "scripts/ambit-gate/**"
      - "!scripts/ambit-gate/**/*.ipynb"
      - "flimgui/**"
      - "irf-library/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - "build_phi2gui.bat"
      - ".github/workflows/gui-release.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ambit-gate/**"
      - "!scripts/ambit-gate/**/*.ipynb"
      - "flimgui/**"
      - "irf-library/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - "build_phi2gui.bat"
      - ".github/workflows/gui-release.yml"
  workflow_dispatch:

permissions:
  contents: read

# Releases stay serial; a manual run builds the zips but never publishes.
concurrency:
  group: phi2gui-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FELIX_DRIVER_URL: https://tediel.com/wp-content/Resources/Felix/Felix_WinUSB_driver.exe

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.pick.outputs.latest }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: pick
        run: |
          set -euo pipefail
          LATEST=$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed 's|.*refs/tags/||; s|\^{}$||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -u | sort -V | tail -1 || true)
          VERSION=$(python3 packaging/stamp_version.py "$LATEST")
          echo "Previous tag: ${LATEST:-none}. Building ${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
            bundle: dist/phi2gui
            executable: dist/phi2gui/phi2gui.exe
          # The oldest supported Ubuntu, so the bundle runs on any Linux with that glibc or newer.
          - os: ubuntu-22.04
            platform: linux-x64
            bundle: dist/phi2gui
            executable: dist/phi2gui/phi2gui
          - os: macos-15
            platform: macos-arm64
            bundle: dist/phi2gui.app
            executable: dist/phi2gui.app/Contents/MacOS/phi2gui
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ZIP: phi2gui-v${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The python.org interpreter; uv makes .venv from it and never downloads one of its own.
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # PyInstaller bundles the libraries it finds on the build machine. Qt's X11 window plugin
      # needs these, and a stock Ubuntu desktop lacks some (libxcb-cursor0 above all), so they go
      # into the bundle from here.
      - name: Install the X11 libraries Qt needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libfreetype6 libdbus-1-3 libegl1 libgl1

      - name: Install dependencies
        shell: bash
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --group build

      - name: Fetch TEDIEL's Felix driver installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: curl -fsSL -o docs/Felix_WinUSB_driver.exe "$FELIX_DRIVER_URL"

      - name: Run tests
        shell: bash
        run: uv run --no-sync pytest -q

      - name: Stamp the version
        shell: bash
        run: |
          set -euo pipefail
          STAMPED=$(uv run --no-sync python packaging/stamp_version.py "${{ needs.version.outputs.latest }}")
          test "$STAMPED" = "$VERSION"

      # PATH cut down to Windows, this Python and .venv, as build_phi2gui.bat does: PyInstaller
      # resolves DLLs through PATH, and a foreign ICU or OpenSSL on it broke v0.1.3 on every PC.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vpy = Resolve-Path .venv\Scripts\python.exe
          $base = & $vpy -c "import sys; print(sys.base_prefix)"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$base;$(Split-Path $vpy)"
          & $vpy -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/phi2gui.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Linux and macOS)
        if: runner.os != 'Windows'
        run: uv run --no-sync python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/phi2gui.spec

      - name: Check every library outside the OS is bundled (Linux and macOS)
        if: runner.os != 'Windows'
        run: uv run --no-sync python packaging/check_bundle.py "${{ matrix.bundle }}"

      # The frozen app loads Qt, pylibtdc's libraries (Windows and Linux) and the main window, then
      # exits. This is the check that would have stopped v0.1.3 ("DLL load failed").
      - name: Smoke-test the executable
        shell: bash
        env:
          EXE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess, sys
          exe = pathlib.Path(os.environ["EXE"]).resolve()
          out = pathlib.Path("smoke-ok.txt").resolve()
          code = subprocess.run([str(exe), "--smoke-test", str(out)], timeout=300).returncode
          log = (pathlib.Path.home() / "Library/Logs/phi2gui.log" if sys.platform == "darwin"
                 else exe.with_name("phi2gui.log"))
          said = out.read_text(encoding="utf-8").strip() if out.is_file() else ""
          if code != 0 or said != f"ok {os.environ['VERSION']}":
              print(log.read_text(encoding="utf-8", errors="replace") if log.is_file() else "(no phi2gui.log)")
              sys.exit(f"smoke test failed (exit {code}, said {said!r})")
          print(said)
          log.unlink(missing_ok=True)
          PY

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging/README-dist.txt dist/phi2gui/README.txt
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/phi2gui -DestinationPath "out/$env:ZIP" -CompressionLevel Optimal

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cp packaging/README-dist.txt dist/phi2gui/README.txt
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd dist
          type -a zip; zip -v | head -2; ls -la; du -sh phi2gui
          zip -r -y "$GITHUB_WORKSPACE/out/$ZIP" phi2gui | tail -3
          ls -la "$GITHUB_WORKSPACE/out"
          test -s "$GITHUB_WORKSPACE/out/$ZIP"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p pkg/phi2gui "$GITHUB_WORKSPACE/out"
          cp -R dist/phi2gui.app pkg/phi2gui/
          cp packaging/README-dist.txt pkg/phi2gui/README.txt
          ditto -c -k --keepParent pkg/phi2gui "$GITHUB_WORKSPACE/out/$ZIP"
          ls -la "$GITHUB_WORKSPACE/out"
          test -s "$GITHUB_WORKSPACE/out/$ZIP"

      - uses: actions/upload-artifact@v6
        with:
          name: phi2gui-${{ matrix.platform }}-${{ github.sha }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: phi2gui-*-${{ github.sha }}
          merge-multiple: true
          path: out

      - name: Check the tag is still free
        id: tag
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh release view "$TAG" --repo "$REPO" --json targetCommitish,isDraft \
            --jq '"\(.targetCommitish) \(.isDraft)"' 2>/dev/null || true)
          if [[ -z "$EXISTING" ]]; then
            echo "publish=create" >> "$GITHUB_OUTPUT"
          elif [[ "$EXISTING" == "${GITHUB_SHA} true" ]]; then
            echo "publish=resume" >> "$GITHUB_OUTPUT"      # a retried run of this commit
          elif [[ "$EXISTING" == "${GITHUB_SHA} false" ]]; then
            echo "publish=done" >> "$GITHUB_OUTPUT"
            echo "${TAG} is already released from this commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::${TAG} already belongs to another commit; rerun the workflow to build the next version."
            exit 1
          fi

      - name: Checksums and release notes
        run: |
          set -euo pipefail
          cd out
          for p in win64 linux-x64 macos-arm64; do test -s "phi2gui-v${VERSION}-${p}.zip"; done
          sha256sum phi2gui-*.zip > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<EOF
          Download the zip for your computer, extract all of it, and see README.txt inside. Nothing else needs installing.

          | Computer | Zip | Felix |
          | --- | --- | --- |
          | Windows 10 or 11, 64-bit | \`phi2gui-v${VERSION}-win64.zip\` | Yes, driver installer included |
          | Linux x64, glibc 2.35 or newer | \`phi2gui-v${VERSION}-linux-x64.zip\` | Bindings included, untested on the set-up |
          | macOS, Apple silicon | \`phi2gui-v${VERSION}-macos-arm64.zip\` | No: TEDIEL ships no macOS library. Opens and uploads saved runs |

          EOF

      # Every asset is uploaded to a draft first; publishing the draft creates the tag.
      - name: Upload draft release
        if: steps.tag.outputs.publish != 'done'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: phi2 GUI ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          body_path: notes.md
          generate_release_notes: true
          files: out/*
          fail_on_unmatched_files: true

      - name: Publish release
        if: steps.tag.outputs.publish != 'done'
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          MAIN_SHA=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')
          # A retried old run publishes its own binaries but never takes Latest from a newer one.
          if [[ "$MAIN_SHA" == "$GITHUB_SHA" ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest=false
          fi
          echo "Released ${TAG}: https://github.com/${REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
