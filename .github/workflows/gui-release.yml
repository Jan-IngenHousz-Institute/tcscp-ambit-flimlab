# Build the standalone phi2 GUI for Windows, Linux and macOS, and release it.
#
#   * every pull request builds and checks all three and keeps the zips as workflow artifacts. The
#     three builds are required checks on main.
#   * every push to main asks semantic-release whether the merged PR titles call for a release
#     (.releaserc.json). If they do, it builds the three zips and publishes them under that version.
#
# Each zip carries everything the app needs except the operating system's own libraries, so the
# person who downloads it installs nothing. packaging/check_bundle.py enforces that on Linux and
# macOS; the smoke test starts every build on a fresh runner.
#
# One job picks the version and every build writes it in (packaging/stamp_version.py), so the three
# executables and the release say the same number. A pull request builds <last tag>+pr.<number>.
#
# uv installs every package from uv.lock, TEDIEL's pylibtdc included (wheels on this repo's
# deps-pylibtdc-* release), and `uv sync --locked` fails the build when uv.lock is out of date.
name: Build and release phi2 GUI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases stay serial; a manual run builds the zips but never publishes.
concurrency:
  group: phi2gui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FELIX_DRIVER_URL: https://tediel.com/wp-content/Resources/Felix/Felix_WinUSB_driver.exe
  SEMANTIC_RELEASE: npx --yes -p semantic-release@24 -p conventional-changelog-conventionalcommits@8 semantic-release

jobs:
  version:
    name: Pick the version
    runs-on: ubuntu-latest
    # semantic-release checks it could push the tag, even in a dry run.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        if: github.event_name == 'push'
        with:
          node-version: 22
      - id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            OUT=$($SEMANTIC_RELEASE --dry-run 2>&1) || { echo "$OUT"; exit 1; }
            echo "$OUT" | tail -20
            VERSION=$(sed -n 's/.*The next release version is \([0-9][^ ]*\).*/\1/p' <<<"$OUT" | head -1)
            if [[ -n "$VERSION" ]]; then RELEASE=true; else RELEASE=false; fi
            BUILD=$RELEASE
          else
            LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            VERSION="${LAST#v}+${PR:+pr.$PR}"
            [[ -n "$PR" ]] || VERSION="${LAST#v}+dev.${GITHUB_RUN_NUMBER}"
            RELEASE=false
            BUILD=true
          fi
          echo "Version: ${VERSION:-none}. Build: ${BUILD}. Release: ${RELEASE}." >> "$GITHUB_STEP_SUMMARY"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    if: needs.version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win64
            bundle: dist/phi2gui
            executable: dist/phi2gui/phi2gui.exe
          # The oldest supported Ubuntu, so the bundle runs on any Linux with that glibc or newer.
          - os: ubuntu-22.04
            platform: linux-x64
            bundle: dist/phi2gui
            executable: dist/phi2gui/phi2gui
          - os: macos-15
            platform: macos-arm64
            bundle: dist/phi2gui.app
            executable: dist/phi2gui.app/Contents/MacOS/phi2gui
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Info-ZIP's zip reads a variable named ZIP as extra arguments, hence ARCHIVE.
      ARCHIVE: phi2gui-v${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The python.org interpreter; uv makes .venv from it and never downloads one of its own.
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # PyInstaller bundles the libraries it finds on the build machine. Qt's X11 window plugin
      # needs these, and a stock Ubuntu desktop lacks some (libxcb-cursor0 above all), so they go
      # into the bundle from here.
      - name: Install the X11 libraries Qt needs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libfreetype6 libdbus-1-3 libegl1 libgl1

      - name: Install dependencies
        shell: bash
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --locked --group build

      - name: Fetch TEDIEL's Felix driver installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: curl -fsSL -o docs/Felix_WinUSB_driver.exe "$FELIX_DRIVER_URL"

      - name: Run tests
        shell: bash
        run: uv run --no-sync pytest -q

      - name: Stamp the version
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python packaging/stamp_version.py "$VERSION"

      # PATH cut down to Windows, this Python and .venv, as build_phi2gui.bat does: PyInstaller
      # resolves DLLs through PATH, and a foreign ICU or OpenSSL on it broke v0.1.3 on every PC.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vpy = Resolve-Path .venv\Scripts\python.exe
          $base = & $vpy -c "import sys; print(sys.base_prefix)"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$base;$(Split-Path $vpy)"
          & $vpy -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/phi2gui.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Linux and macOS)
        if: runner.os != 'Windows'
        run: uv run --no-sync python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/phi2gui.spec

      - name: Check every library outside the OS is bundled (Linux and macOS)
        if: runner.os != 'Windows'
        run: uv run --no-sync python packaging/check_bundle.py "${{ matrix.bundle }}"

      # The frozen app loads Qt, pylibtdc's libraries (Windows and Linux) and the main window, then
      # exits. This is the check that would have stopped v0.1.3 ("DLL load failed").
      - name: Smoke-test the executable
        shell: bash
        env:
          EXE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess, sys
          exe = pathlib.Path(os.environ["EXE"]).resolve()
          out = pathlib.Path("smoke-ok.txt").resolve()
          code = subprocess.run([str(exe), "--smoke-test", str(out)], timeout=300).returncode
          log = (pathlib.Path.home() / "Library/Logs/phi2gui.log" if sys.platform == "darwin"
                 else exe.with_name("phi2gui.log"))
          said = out.read_text(encoding="utf-8").strip() if out.is_file() else ""
          if code != 0 or said != f"ok {os.environ['VERSION']}":
              print(log.read_text(encoding="utf-8", errors="replace") if log.is_file() else "(no phi2gui.log)")
              sys.exit(f"smoke test failed (exit {code}, said {said!r})")
          print(said)
          log.unlink(missing_ok=True)
          PY

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging/README-dist.txt dist/phi2gui/README.txt
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/phi2gui -DestinationPath "out/$env:ARCHIVE" -CompressionLevel Optimal

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cp packaging/README-dist.txt dist/phi2gui/README.txt
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd dist
          zip -q -r -y "$GITHUB_WORKSPACE/out/$ARCHIVE" phi2gui
          ls -la "$GITHUB_WORKSPACE/out"
          test -s "$GITHUB_WORKSPACE/out/$ARCHIVE"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p pkg/phi2gui "$GITHUB_WORKSPACE/out"
          cp -R dist/phi2gui.app pkg/phi2gui/
          cp packaging/README-dist.txt pkg/phi2gui/README.txt
          ditto -c -k --keepParent pkg/phi2gui "$GITHUB_WORKSPACE/out/$ARCHIVE"
          ls -la "$GITHUB_WORKSPACE/out"
          test -s "$GITHUB_WORKSPACE/out/$ARCHIVE"

      - uses: actions/upload-artifact@v6
        with:
          name: phi2gui-${{ matrix.platform }}-${{ github.sha }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: [version, build]
    if: github.event_name == 'push' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          pattern: phi2gui-*-${{ github.sha }}
          merge-multiple: true
          path: out

      - name: Checksums
        run: |
          set -euo pipefail
          cd out
          for p in win64 linux-x64 macos-arm64; do test -s "phi2gui-v${VERSION}-${p}.zip"; done
          sha256sum phi2gui-*.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Tags the commit v<version> and publishes the release with the zips, SHA256SUMS and notes
      # written from the PR titles since the last release (.releaserc.json).
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: $SEMANTIC_RELEASE

      - name: Check the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' | sort
          test "$(gh release view "v${VERSION}" --json assets --jq '.assets | length')" -eq 4
          echo "Released v${VERSION}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
