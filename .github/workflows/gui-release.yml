# Build the standalone phi2 GUI for Windows and release it.
#
#   * pull requests build and smoke-test the exe and keep it as a workflow artifact;
#   * every push to main that touches the GUI publishes it as a GitHub release, tagged v<next>.
#
# The version is the latest v* tag's patch + 1, or __version__ in phi2gui/__init__.py when a person
# raised it above that (packaging/stamp_version.py). It is written into the build, so the exe and
# the release always say the same number; nobody bumps it by hand before a release.
#
# TEDIEL's pylibtdc is not on PyPI. The build takes the cp313 Windows wheel from TEDIEL's own
# download (https://tediel.com/resources), pinned by its SHA-256, as build_phi2gui.bat expects it
# in docs/pylibtdc-2026-09-01.zip. A new pylibtdc means a new URL and hash below.
name: Build and release phi2 GUI

on:
  pull_request:
    paths:
      - "scripts/ambit-gate/**"
      - "!scripts/ambit-gate/**/*.ipynb"
      - "flimgui/**"
      - "irf-library/**"
      - "packaging/**"
      - "requirements.txt"
      - "build_phi2gui.bat"
      - ".github/workflows/gui-release.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ambit-gate/**"
      - "!scripts/ambit-gate/**/*.ipynb"
      - "flimgui/**"
      - "irf-library/**"
      - "packaging/**"
      - "requirements.txt"
      - "build_phi2gui.bat"
      - ".github/workflows/gui-release.yml"
  workflow_dispatch:

permissions:
  contents: read

# Releases stay serial; a manual run builds the exe but never publishes.
concurrency:
  group: phi2gui-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYLIBTDC_URL: https://tediel.com/wp-content/Resources/Common/2026.09.01/pylibtdc-2026-09-01.zip
  PYLIBTDC_SHA256: 1856e096897ac5eadf2f6a15a3a39af86ffa7dbfcf550cecafb59bbab655e73a
  PYLIBTDC_WHEEL: wheelhouse/pylibtdc-1.18.2.1-cp313-cp313-win_amd64.whl
  FELIX_DRIVER_URL: https://tediel.com/wp-content/Resources/Felix/Felix_WinUSB_driver.exe

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install dependencies and TEDIEL's pylibtdc
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o pylibtdc.zip "$PYLIBTDC_URL"
          echo "$PYLIBTDC_SHA256  pylibtdc.zip" | sha256sum -c -
          python -c "import sys, zipfile; zipfile.ZipFile('pylibtdc.zip').extract(sys.argv[1])" "$PYLIBTDC_WHEEL"
          python -m pip install -r packaging/requirements-build.txt "$PYLIBTDC_WHEEL"
          curl -fsSL -o docs/Felix_WinUSB_driver.exe "$FELIX_DRIVER_URL"

      - name: Run tests
        run: python -m pytest tests -q

      - name: Choose and stamp the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed 's|.*refs/tags/||; s|\^{}$||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -u | sort -V | tail -1 || true)
          VERSION=$(python packaging/stamp_version.py "$LATEST")
          echo "Previous tag: ${LATEST:-none}. Building ${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # PATH cut down to Windows and this Python, as build_phi2gui.bat does: PyInstaller resolves
      # DLLs through PATH, and a foreign ICU or OpenSSL on it broke v0.1.3 on every PC.
      - name: Build standalone application
        shell: pwsh
        run: |
          $py = Split-Path (Get-Command python).Source
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$py;$py\Scripts"
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/phi2gui.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item packaging/README-dist.txt dist/phi2gui/README.txt

      # The frozen exe loads Qt, pylibtdc's DLLs and the main window, then exits. This is the
      # check that would have stopped v0.1.3 ("DLL load failed while importing QtWidgets").
      - name: Smoke-test the executable
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess, sys
          exe = pathlib.Path("dist/phi2gui/phi2gui.exe").resolve()
          out = pathlib.Path("smoke-ok.txt").resolve()
          code = subprocess.run([str(exe), "--smoke-test", str(out)], timeout=180).returncode
          log = exe.with_name("phi2gui.log")
          said = out.read_text(encoding="utf-8").strip() if out.is_file() else ""
          if code != 0 or said != f"ok {os.environ['VERSION']}":
              print(log.read_text(encoding="utf-8", errors="replace") if log.is_file() else "(no phi2gui.log)")
              sys.exit(f"smoke test failed (exit {code}, said {said!r})")
          print(said)
          log.unlink(missing_ok=True)
          PY

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/phi2gui -DestinationPath "out/phi2gui-v${{ steps.version.outputs.version }}-win64.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v6
        with:
          name: phi2gui-win64-${{ github.sha }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: phi2gui-win64-${{ github.sha }}
          path: out

      - name: Check the tag is still free
        id: tag
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          EXISTING=$(gh release view "$TAG" --repo "$REPO" --json targetCommitish,isDraft \
            --jq '"\(.targetCommitish) \(.isDraft)"' 2>/dev/null || true)
          if [[ -z "$EXISTING" ]]; then
            echo "publish=create" >> "$GITHUB_OUTPUT"
          elif [[ "$EXISTING" == "${GITHUB_SHA} true" ]]; then
            echo "publish=resume" >> "$GITHUB_OUTPUT"      # a retried run of this commit
          elif [[ "$EXISTING" == "${GITHUB_SHA} false" ]]; then
            echo "publish=done" >> "$GITHUB_OUTPUT"
            echo "${TAG} is already released from this commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::${TAG} already belongs to another commit; rerun the workflow to build the next version."
            exit 1
          fi

      - name: Checksums
        run: |
          set -euo pipefail
          cd out
          test -s "phi2gui-v${VERSION}-win64.zip"
          sha256sum phi2gui-*.zip > SHA256SUMS
          cat SHA256SUMS

      # Every asset is uploaded to a draft first; publishing the draft creates the tag.
      - name: Upload draft release
        if: steps.tag.outputs.publish != 'done'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: phi2 GUI ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: out/*
          fail_on_unmatched_files: true

      - name: Publish release
        if: steps.tag.outputs.publish != 'done'
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          MAIN_SHA=$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')
          # A retried old run publishes its own binaries but never takes Latest from a newer one.
          if [[ "$MAIN_SHA" == "$GITHUB_SHA" ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest=false
          fi
          echo "Released ${TAG}: https://github.com/${REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
