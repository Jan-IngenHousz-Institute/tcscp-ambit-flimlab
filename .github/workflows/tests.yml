name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # --frozen: the Felix bindings (wheelhouse/, fetched by packaging/fetch_pylibtdc.py) are not
      # needed for the tests; the release workflow syncs --locked with them and checks the lock.
      - run: uv sync --frozen --no-group felix
      - run: uv run --frozen --no-group felix pytest -q
