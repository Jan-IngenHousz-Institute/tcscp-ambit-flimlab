[project]
name = "tcscp-ambit-flimlab"
version = "0"
description = "AMBIT + Felix TCSPC: PSII quantum yield from fluorescence intensity and lifetime, with the phi2 GUI"
readme = "README.md"
# pylibtdc ships cp313 wheels and the standalone build is made with 3.13
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
    "pyserial>=3.5",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8", "nbstripout>=0.7", "ipykernel>=6"]
build = ["pyinstaller>=6.10"]
# TEDIEL's Felix bindings, not on PyPI: `uv run --no-project packaging/fetch_pylibtdc.py` first
felix = [
    "pylibtdc ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

[tool.uv]
package = false
default-groups = ["dev", "felix"]

[tool.uv.sources]
pylibtdc = [
    { path = "wheelhouse/pylibtdc-1.18.2.1-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { path = "wheelhouse/pylibtdc-1.18.2.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
